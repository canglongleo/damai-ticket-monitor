name: 🎫 周杰伦演唱会抢票监控（高频模式）

on:
  schedule:
    # 24小时覆盖 = 4个 cron × 每次运行5.5小时
    # UTC时间 = 北京时间 - 8
    - cron: '0 0,6,12,18 * * *'   # 每6小时启动一次新实例
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6小时，每个实例持续运行

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚀 启动高频监控（每3秒检查，持续5.5小时）
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: node cloud-monitor.js
